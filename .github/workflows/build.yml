name: Build SwiftUI Studio

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-intel-macos:
    # macos-13 is an Intel runner, suitable for producing x86_64 artifacts.
    runs-on: macos-13
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="SwiftUI Studio.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          swiftc -O -target x86_64-apple-macosx12.0 \
            -framework SwiftUI -framework AppKit \
            Sources/SwiftUIStudio/main.swift \
            -o "$APP/Contents/MacOS/SwiftUIStudio"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>SwiftUIStudio</string>
            <key>CFBundleIdentifier</key><string>com.red5225.swiftuistudio</string>
            <key>CFBundleName</key><string>SwiftUI Studio</string>
            <key>CFBundleDisplayName</key><string>SwiftUI Studio</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0.0</string>
            <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" SwiftUI-Studio-macOS-Intel.zip
          hdiutil create -volname "SwiftUI Studio" -srcfolder "$APP" -ov -format UDZO SwiftUI-Studio-macOS-Intel.dmg
          file "$APP/Contents/MacOS/SwiftUIStudio"

      - name: Upload downloadable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SwiftUI-Studio-macOS-Intel
          path: |
            SwiftUI-Studio-macOS-Intel.zip
            SwiftUI-Studio-macOS-Intel.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Publish release assets for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            SwiftUI-Studio-macOS-Intel.zip
            SwiftUI-Studio-macOS-Intel.dmg
