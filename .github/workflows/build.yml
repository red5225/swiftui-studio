name: Build SwiftUI Studio

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: swiftui-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-intel-macos:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Inspect build environment
        run: |
          sw_vers
          uname -m
          xcode-select -p
          swiftc --version
      - name: Build app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="SwiftUI Studio.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          swiftc -O -target x86_64-apple-macosx12.0 \
            -framework SwiftUI -framework AppKit \
            Sources/SwiftUIStudio/main.swift \
            -o "$APP/Contents/MacOS/SwiftUIStudio"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>SwiftUIStudio</string>
          <key>CFBundleIdentifier</key><string>com.red5225.swiftuistudio</string>
          <key>CFBundleName</key><string>SwiftUI Studio</string>
          <key>CFBundleDisplayName</key><string>SwiftUI Studio</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>1.1.0</string>
          <key>LSMinimumSystemVersion</key><string>12.0</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" SwiftUI-Studio-macOS-Intel.zip
          hdiutil create -volname "SwiftUI Studio" -srcfolder "$APP" -ov -format UDZO SwiftUI-Studio-macOS-Intel.dmg
      - name: Upload downloadable app and DMG
        uses: actions/upload-artifact@v4
        with:
          name: SwiftUI-Studio-macOS-Intel
          path: |
            SwiftUI-Studio-macOS-Intel.zip
            SwiftUI-Studio-macOS-Intel.dmg
          if-no-files-found: error
          retention-days: 30
      - name: Publish release assets for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            SwiftUI-Studio-macOS-Intel.zip
            SwiftUI-Studio-macOS-Intel.dmg
